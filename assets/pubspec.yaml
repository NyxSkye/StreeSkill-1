# pubspec.yaml

name: streeskill
description: A new Flutter project for video playback.
publish_to: 'none' # Remove this line if you want to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Required for the video playback functionality
  video_player: ^2.8.1
  # Required for the custom video controls and UI
  chewie: ^1.7.5
  # Required for launching external URLs (good practice for mobile apps)
  url_launcher: ^6.2.2

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Uncomment the following section to add assets to your application
  # assets:
  #   - assets/